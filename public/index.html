<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph - Live Voting Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1e1e1e;
            --bg-card: #181818;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-blue: #60a5fa;
            --accent-purple: #a78bfa;
            --border-color: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .wallet-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .wallet-btn:hover { background: var(--bg-secondary); border-color: var(--accent-blue); }
        .wallet-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); }

        /* Live Status Section */
        .live-section {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.1), rgba(96, 165, 250, 0.1));
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .live-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue), var(--accent-purple));
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .live-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: rgba(74, 222, 128, 0.2);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
        }

        .live-indicator .pulse {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .live-indicator.idle {
            background: rgba(102, 102, 102, 0.2);
            color: var(--text-muted);
        }

        .live-indicator.idle .pulse {
            background: var(--text-muted);
            animation: none;
        }

        .live-title { font-size: 14px; color: var(--text-secondary); }

        .live-content {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .live-task-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-blue);
        }

        .live-task-summary {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.7;
        }

        .live-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .live-stat {
            background: var(--bg-tertiary);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .live-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .live-stat-value { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-top: 4px; }
        .live-stat-value.cost { color: var(--accent-yellow); }
        .live-stat-value.success { color: var(--accent-green); }

        .task-details {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--border-color);
            margin-top: 16px;
        }

        .task-details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .task-details-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-details-toggle {
            font-size: 12px;
            color: var(--accent-blue);
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .task-details-content {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            font-family: inherit;
        }

        .task-details-content::-webkit-scrollbar { width: 6px; }
        .task-details-content::-webkit-scrollbar-track { background: var(--bg-primary); }
        .task-details-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .voter-count {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* Proposal Cards */
        .proposal-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .proposal-card:hover { border-color: #3a3a3a; }
        .proposal-card.active { border-color: var(--accent-yellow); }

        .proposal-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .proposal-id-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .proposal-id {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .proposal-status {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-active { background: rgba(251, 191, 36, 0.2); color: var(--accent-yellow); }
        .status-approved { background: rgba(74, 222, 128, 0.2); color: var(--accent-green); }
        .status-rejected { background: rgba(248, 113, 113, 0.2); color: var(--accent-red); }
        .status-expired { background: rgba(102, 102, 102, 0.2); color: var(--text-muted); }

        .proposal-task-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent-blue);
        }

        .proposal-question {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .proposal-context {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .context-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .context-item {
            display: flex;
            flex-direction: column;
        }

        .context-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .context-value {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .proposal-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .countdown { color: var(--accent-yellow); font-weight: 600; }

        .vote-section {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .vote-stats {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }

        .vote-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        .vote-stat.yes { color: var(--accent-green); }
        .vote-stat.no { color: var(--accent-red); }

        .vote-bar {
            flex: 1;
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
            min-width: 80px;
        }

        .vote-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            transition: width 0.3s;
        }

        .vote-actions {
            display: flex;
            gap: 8px;
        }

        .vote-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .vote-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .vote-btn.yes { background: var(--accent-green); color: #000; }
        .vote-btn.yes:hover:not(:disabled) { background: #22c55e; }
        .vote-btn.no { background: var(--accent-red); color: #000; }
        .vote-btn.no:hover:not(:disabled) { background: #ef4444; }

        .ipfs-link {
            font-size: 11px;
            color: var(--accent-purple);
            text-decoration: none;
        }
        .ipfs-link:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading { display: flex; justify-content: center; align-items: center; padding: 40px; }
        .spinner { width: 24px; height: 24px; border: 2px solid var(--border-color); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        .toast { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; display: none; animation: slideIn 0.3s ease; }
        .toast.show { display: block; }
        .toast.success { background: #166534; color: white; }
        .toast.error { background: #991b1b; color: white; }
        .toast.info { background: #1e40af; color: white; }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .hat-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--accent-purple);
            background: rgba(167, 139, 250, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 15px; }
            .live-stats { grid-template-columns: 1fr 1fr; }
            .vote-section { flex-direction: column; align-items: stretch; }
            .vote-actions { width: 100%; }
            .vote-btn { flex: 1; }
        }

        /* IPFS CID Input */
        .ipfs-input-section {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            border: 1px solid var(--border-color);
        }

        .ipfs-input-row {
            display: flex;
            gap: 8px;
        }

        .ipfs-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
        }

        .ipfs-input::placeholder { color: var(--text-muted); }

        .ipfs-fetch-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: var(--accent-purple);
            color: #000;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <span class="logo">R</span>
                Ralph Voting Portal
            </h1>
            <button id="walletBtn" class="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
        </header>

        <!-- Live Status Section -->
        <div id="liveSection" class="live-section">
            <div class="live-header">
                <div id="liveIndicator" class="live-indicator idle">
                    <span class="pulse"></span>
                    <span id="liveStatus">IDLE</span>
                </div>
                <span class="live-title">Ralph Agent Status</span>
            </div>
            <div class="live-content">
                <div id="liveTaskHeader" class="live-task-header">Waiting for proposals...</div>
                <div id="liveTaskSummary" class="live-task-summary" style="display: none;"></div>
                <div id="liveStats" class="live-stats" style="display: none;">
                    <div class="live-stat">
                        <div class="live-stat-label">Iteration</div>
                        <div id="statIteration" class="live-stat-value">-</div>
                    </div>
                    <div class="live-stat">
                        <div class="live-stat-label">Success</div>
                        <div id="statSuccess" class="live-stat-value success">-</div>
                    </div>
                    <div class="live-stat">
                        <div class="live-stat-label">Cost</div>
                        <div id="statCost" class="live-stat-value cost">-</div>
                    </div>
                    <div class="live-stat">
                        <div class="live-stat-label">Time Left</div>
                        <div id="statTime" class="live-stat-value">-</div>
                    </div>
                </div>
                <div id="taskDetails" class="task-details" style="display: none;">
                    <div class="task-details-header">
                        <span class="task-details-title">Full Task Prompt</span>
                        <button class="task-details-toggle" onclick="toggleTaskDetails()">Collapse</button>
                    </div>
                    <div id="taskDetailsContent" class="task-details-content"></div>
                </div>
                <div id="ipfsInputSection" class="ipfs-input-section" style="display: none;">
                    <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">Manual IPFS load (fallback):</div>
                    <div class="ipfs-input-row">
                        <input type="text" id="ipfsCidInput" class="ipfs-input" placeholder="Enter IPFS CID (e.g., QmXxx...)">
                        <button class="ipfs-fetch-btn" onclick="fetchIPFSManual()">Load</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Proposals Section -->
        <div class="section-header">
            <span class="section-title">Proposals</span>
            <div id="voterInfo" class="voter-count" style="display: none;">
                <span>Eligible Voters:</span>
                <strong id="voterCount">-</strong>
            </div>
        </div>

        <div id="proposalsList">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>

    <div class="toast-container">
        <div id="toast" class="toast"></div>
    </div>

    <script>
        // Contract configuration
        const CONTRACT_ADDRESS = '0x9Bcf229d6Ca62Dc08f3720266Ad16e6C658eC69D';
        const CHAIN_ID = 8453;
        const RPC_URL = 'https://base.publicnode.com';
        const IPFS_GATEWAY = 'https://gateway.pinata.cloud/ipfs';

        // Contract ABI - includes ipfsCid field
        const CONTRACT_ABI = [
            'function proposalCount() view returns (uint256)',
            'function getProposal(uint256) view returns (bytes32 questionHash, uint256 requiredHatId, uint256 yesVotes, uint256 noVotes, uint256 deadline, bool executed, address creator, string ipfsCid)',
            'function vote(uint256 proposalId, bool support)',
            'function hasVoted(uint256 proposalId, address voter) view returns (bool)',
            'event ProposalCreated(uint256 indexed proposalId, bytes32 questionHash, uint256 hatId, uint256 deadline, address creator, string ipfsCid)'
        ];

        const HATS_ABI = [
            'function isWearerOfHat(address account, uint256 hatId) view returns (bool)',
            'function hatSupply(uint256 hatId) view returns (uint32)'
        ];
        const HATS_ADDRESS = '0x3bc1A0Ad72417f2d411118085256fC53CBdDd137';

        let provider = null;
        let signer = null;
        let connectedAddress = null;
        let contract = null;
        let hatsContract = null;
        let currentIPFSContent = null;
        let hatWearerCounts = {};
        let taskDetailsExpanded = true;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        async function connectWallet() {
            if (!window.ethereum) {
                showToast('Please install MetaMask', 'error');
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });

                if (parseInt(chainId, 16) !== CHAIN_ID) {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x' + CHAIN_ID.toString(16) }]
                    });
                }

                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                connectedAddress = await signer.getAddress();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                hatsContract = new ethers.Contract(HATS_ADDRESS, HATS_ABI, provider);

                updateWalletUI();
                loadProposals();
                showToast('Wallet connected', 'success');
            } catch (error) {
                console.error('Connection error:', error);
                showToast('Failed to connect: ' + error.message, 'error');
            }
        }

        function updateWalletUI() {
            const btn = document.getElementById('walletBtn');
            if (connectedAddress) {
                const shortAddr = connectedAddress.slice(0, 6) + '...' + connectedAddress.slice(-4);
                btn.innerHTML = '<span class="dot"></span>' + shortAddr;
            }
        }

        async function fetchIPFSContent(cid) {
            try {
                const response = await fetch(`${IPFS_GATEWAY}/${cid}`);
                if (!response.ok) throw new Error('Failed to fetch');
                return await response.json();
            } catch (e) {
                console.log('Could not fetch IPFS content:', e);
                return null;
            }
        }

        async function fetchIPFSManual() {
            const input = document.getElementById('ipfsCidInput');
            const cid = input.value.trim();
            if (!cid) {
                showToast('Please enter an IPFS CID', 'error');
                return;
            }

            showToast('Fetching IPFS content...', 'info');
            const content = await fetchIPFSContent(cid);
            if (content) {
                currentIPFSContent = content;
                updateLiveSectionWithIPFS(content);
                showToast('IPFS content loaded!', 'success');
            } else {
                showToast('Failed to load IPFS content', 'error');
            }
        }

        function toggleTaskDetails() {
            const content = document.getElementById('taskDetailsContent');
            const btn = document.querySelector('.task-details-toggle');
            taskDetailsExpanded = !taskDetailsExpanded;
            content.style.display = taskDetailsExpanded ? 'block' : 'none';
            btn.textContent = taskDetailsExpanded ? 'Collapse' : 'Expand';
        }

        async function getHatWearerCount(hatId) {
            if (hatWearerCounts[hatId]) return hatWearerCounts[hatId];

            try {
                const readProvider = new ethers.JsonRpcProvider(RPC_URL);
                const hats = new ethers.Contract(HATS_ADDRESS, HATS_ABI, readProvider);
                const supply = await hats.hatSupply(hatId);
                hatWearerCounts[hatId] = Number(supply);
                return hatWearerCounts[hatId];
            } catch (e) {
                console.log('Could not get hat supply:', e);
                return null;
            }
        }

        async function loadProposals() {
            const container = document.getElementById('proposalsList');

            try {
                const readProvider = new ethers.JsonRpcProvider(RPC_URL);
                const readContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, readProvider);

                const count = await readContract.proposalCount();
                const currentTime = Math.floor(Date.now() / 1000);

                if (count === 0n) {
                    container.innerHTML = '<div class="empty-state"><p>No proposals yet. Ralph will create proposals when running.</p></div>';
                    updateLiveSection(null);
                    return;
                }

                const proposals = [];
                const start = Math.max(1, Number(count) - 19);

                for (let i = start; i <= Number(count); i++) {
                    try {
                        const p = await readContract.getProposal(i);
                        const deadline = Number(p[4]);
                        const executed = p[5];
                        const yesVotes = Number(p[2]);
                        const noVotes = Number(p[3]);
                        const isActive = deadline > currentTime && !executed;

                        let status = 'expired';
                        if (isActive) status = 'active';
                        else if (executed || deadline <= currentTime) {
                            status = yesVotes > noVotes ? 'approved' : (yesVotes === noVotes && yesVotes === 0 ? 'expired' : 'rejected');
                        }

                        const hatId = p[1].toString();
                        const wearerCount = await getHatWearerCount(hatId);
                        const ipfsCid = p[7] || '';  // Get IPFS CID from contract

                        proposals.push({
                            id: i,
                            questionHash: p[0],
                            hatId,
                            yesVotes,
                            noVotes,
                            deadline,
                            executed,
                            creator: p[6],
                            ipfsCid,
                            isActive,
                            status,
                            wearerCount
                        });
                    } catch (e) {
                        console.error('Error loading proposal', i, e);
                    }
                }

                proposals.sort((a, b) => b.id - a.id);

                // Update live section
                const activeProposal = proposals.find(p => p.isActive);

                // Auto-fetch IPFS content for active proposal
                if (activeProposal && activeProposal.ipfsCid && !currentIPFSContent) {
                    console.log('Auto-fetching IPFS content:', activeProposal.ipfsCid);
                    fetchIPFSContent(activeProposal.ipfsCid).then(content => {
                        if (content) {
                            currentIPFSContent = content;
                            updateLiveSectionWithIPFS(content);
                            // Re-render proposals with updated content
                            container.innerHTML = proposals.map(p => renderProposal(p)).join('');
                        }
                    });
                }

                updateLiveSection(activeProposal);

                // Update voter info
                if (proposals.length > 0 && proposals[0].wearerCount) {
                    document.getElementById('voterInfo').style.display = 'flex';
                    document.getElementById('voterCount').textContent = proposals[0].wearerCount;
                }

                container.innerHTML = proposals.map(p => renderProposal(p)).join('');

                // Start countdown timers
                proposals.forEach(p => {
                    if (p.isActive) updateCountdown(p.id, p.deadline);
                });

            } catch (error) {
                console.error('Failed to load proposals:', error);
                container.innerHTML = '<div class="empty-state"><p>Failed to load proposals. Check console for details.</p></div>';
            }
        }

        function updateLiveSection(activeProposal) {
            const indicator = document.getElementById('liveIndicator');
            const statusEl = document.getElementById('liveStatus');
            const taskHeader = document.getElementById('liveTaskHeader');
            const taskSummary = document.getElementById('liveTaskSummary');
            const statsEl = document.getElementById('liveStats');
            const taskDetails = document.getElementById('taskDetails');
            const ipfsInputSection = document.getElementById('ipfsInputSection');

            if (activeProposal) {
                indicator.className = 'live-indicator';
                statusEl.textContent = 'AWAITING VOTE';
                statsEl.style.display = 'grid';

                // If we have IPFS content, show it
                if (currentIPFSContent) {
                    updateLiveSectionWithIPFS(currentIPFSContent);
                    ipfsInputSection.style.display = 'none';
                } else {
                    taskHeader.textContent = `Proposal #${activeProposal.id}: Iteration Approval`;
                    taskSummary.style.display = 'none';
                    taskDetails.style.display = 'none';
                    // Show manual IPFS input only if no CID on contract and no content loaded
                    ipfsInputSection.style.display = activeProposal.ipfsCid ? 'none' : 'block';
                }

                document.getElementById('statIteration').textContent = activeProposal.id;
                document.getElementById('statSuccess').textContent = `${activeProposal.yesVotes}/${activeProposal.yesVotes + activeProposal.noVotes}`;
                document.getElementById('statCost').textContent = '$0.00';

                // Update time countdown
                updateLiveCountdown(activeProposal.deadline);
            } else {
                indicator.className = 'live-indicator idle';
                statusEl.textContent = 'IDLE';
                taskHeader.textContent = 'No active proposals. Ralph is either paused or waiting for the next task.';
                taskSummary.style.display = 'none';
                statsEl.style.display = 'none';
                taskDetails.style.display = 'none';
                ipfsInputSection.style.display = 'none';
            }
        }

        function updateLiveSectionWithIPFS(content) {
            const taskHeader = document.getElementById('liveTaskHeader');
            const taskSummary = document.getElementById('liveTaskSummary');
            const taskDetails = document.getElementById('taskDetails');
            const taskDetailsContent = document.getElementById('taskDetailsContent');

            if (content.context) {
                // Show task summary
                if (content.context.task_summary) {
                    taskHeader.textContent = content.context.task_summary;
                }

                // Show iteration info
                if (content.context.iteration) {
                    document.getElementById('statIteration').textContent = content.context.iteration;
                }

                // Show cost
                if (content.context.current_cost !== undefined) {
                    document.getElementById('statCost').textContent = `$${content.context.current_cost.toFixed(2)}`;
                }

                // Show success rate
                const success = content.context.successful_iterations || 0;
                const failed = content.context.failed_iterations || 0;
                document.getElementById('statSuccess').textContent = `${success}/${success + failed}`;

                // Show full task prompt
                if (content.context.task_prompt) {
                    taskSummary.textContent = `Question: ${content.question}`;
                    taskSummary.style.display = 'block';

                    taskDetailsContent.textContent = content.context.task_prompt;
                    taskDetails.style.display = 'block';
                }
            }
        }

        function updateLiveCountdown(deadline) {
            const el = document.getElementById('statTime');
            const update = () => {
                const remaining = deadline - Math.floor(Date.now() / 1000);
                if (remaining <= 0) {
                    el.textContent = 'Ended';
                    return false;
                }
                const minutes = Math.floor(remaining / 60);
                const seconds = Math.floor(remaining % 60);
                el.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                return true;
            };
            update();
            const interval = setInterval(() => {
                if (!update()) clearInterval(interval);
            }, 1000);
        }

        function renderProposal(p) {
            const totalVotes = p.yesVotes + p.noVotes;
            const yesPercent = totalVotes > 0 ? (p.yesVotes / totalVotes) * 100 : 50;
            const canVoteOnThis = p.isActive && connectedAddress;

            // Get task name from IPFS content if available
            const taskName = currentIPFSContent?.context?.task_summary || 'Iteration Approval';

            return `
                <div class="proposal-card ${p.isActive ? 'active' : ''}" data-id="${p.id}">
                    <div class="proposal-top">
                        <div class="proposal-id-badge">
                            <span class="proposal-id">#${p.id}</span>
                            <span class="proposal-status status-${p.status}">${p.status}</span>
                            ${p.ipfsCid ? `<a href="${IPFS_GATEWAY}/${p.ipfsCid}" target="_blank" class="ipfs-link" title="View on IPFS">IPFS</a>` : ''}
                        </div>
                        ${p.wearerCount ? `<div class="hat-info">&#127913; ${p.wearerCount} voter${p.wearerCount !== 1 ? 's' : ''}</div>` : ''}
                    </div>

                    <div class="proposal-task-name">${escapeHtml(taskName)}</div>
                    <div class="proposal-question">Should Ralph proceed with iteration ${p.id}?</div>

                    <div class="proposal-context">
                        <div class="context-grid">
                            <div class="context-item">
                                <span class="context-label">Type</span>
                                <span class="context-value">Iteration</span>
                            </div>
                            <div class="context-item">
                                <span class="context-label">Votes</span>
                                <span class="context-value">${totalVotes}/${p.wearerCount || '?'}</span>
                            </div>
                            <div class="context-item">
                                <span class="context-label">Creator</span>
                                <span class="context-value">${p.creator ? p.creator.slice(0, 6) + '...' : '-'}</span>
                            </div>
                            <div class="context-item">
                                <span class="context-label">Deadline</span>
                                <span id="countdown-${p.id}" class="context-value countdown">${p.isActive ? '-' : formatTime(p.deadline)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="vote-section">
                        <div class="vote-stats">
                            <div class="vote-stat yes">&#9650; ${p.yesVotes}</div>
                            <div class="vote-bar">
                                <div class="vote-bar-fill" style="width: ${yesPercent}%"></div>
                            </div>
                            <div class="vote-stat no">&#9660; ${p.noVotes}</div>
                        </div>
                        <div class="vote-actions">
                            <button class="vote-btn yes" onclick="vote(${p.id}, true)" ${!canVoteOnThis ? 'disabled' : ''}>Approve</button>
                            <button class="vote-btn no" onclick="vote(${p.id}, false)" ${!canVoteOnThis ? 'disabled' : ''}>Reject</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateCountdown(proposalId, deadline) {
            const el = document.getElementById('countdown-' + proposalId);
            if (!el) return;

            const update = () => {
                const remaining = deadline - Math.floor(Date.now() / 1000);
                if (remaining <= 0) {
                    el.textContent = 'Ended';
                    return false;
                }
                const minutes = Math.floor(remaining / 60);
                const seconds = Math.floor(remaining % 60);
                el.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                return true;
            };

            update();
            const interval = setInterval(() => {
                if (!update()) {
                    clearInterval(interval);
                    setTimeout(loadProposals, 1000);
                }
            }, 1000);
        }

        async function vote(proposalId, support) {
            if (!contract || !signer) {
                showToast('Please connect your wallet first', 'error');
                return;
            }

            const card = document.querySelector(`[data-id="${proposalId}"]`);
            const buttons = card.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            try {
                showToast('Submitting vote on-chain...', 'info');
                const tx = await contract.vote(proposalId, support);
                showToast('Transaction submitted, waiting...', 'info');
                await tx.wait();
                showToast('Vote recorded!', 'success');
                setTimeout(loadProposals, 2000);
            } catch (error) {
                console.error('Vote error:', error);
                if (error.code === 4001) {
                    showToast('Transaction rejected', 'error');
                } else if (error.message.includes('NotHatWearer')) {
                    showToast('You must wear the required hat to vote', 'error');
                } else if (error.message.includes('AlreadyVoted')) {
                    showToast('Already voted on this proposal', 'error');
                } else {
                    showToast('Vote failed: ' + (error.reason || error.message), 'error');
                }
                buttons.forEach(b => b.disabled = false);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            return new Date(timestamp * 1000).toLocaleTimeString();
        }

        // Event listeners
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) location.reload();
                else { connectedAddress = accounts[0]; updateWalletUI(); loadProposals(); }
            });
            window.ethereum.on('chainChanged', () => location.reload());
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProposals();
            setInterval(loadProposals, 10000);
        });
    </script>
</body>
</html>
